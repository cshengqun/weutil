<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root {
    --font-ui: 'Space Grotesk', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --bg: #0b1020; --bg-2: #101731; --bg-3: #17203f; --bg-4: #202b50;
    --border: #25315a; --border-2: #34406e;
    --text: #e9edf7; --dim: #9aa6c4; --faint: #5f6c90;
    --accent: #e8a25c; --accent-hi: #f6c28a; --accent-ink: #201403;
    --ok: #7bd39a; --err: #f0837c; --warn: #f0c674;
    --tok-key: #86b9f0; --tok-str: #9fd3a4; --tok-num: #f0b46e; --tok-bool: #c792ea; --tok-null: #f0837c;
    --shadow: 0 14px 40px rgba(0,0,0,.42); --radius: 12px;
  }
  html[data-theme="light"] {
    --bg: #f2f5fb; --bg-2: #ffffff; --bg-3: #edf1f9; --bg-4: #e3e9f5;
    --border: #d9e0ef; --border-2: #c2cce2;
    --text: #1c2334; --dim: #55617e; --faint: #8a94ad;
    --accent: #c67d34; --accent-hi: #a9641f; --accent-ink: #ffffff;
    --ok: #1f9d57; --err: #d6453c; --warn: #b27a13;
    --tok-key: #1f6fd0; --tok-str: #1d8a3c; --tok-num: #b25e13; --tok-bool: #7c3aed; --tok-null: #d6453c;
    --shadow: 0 14px 40px rgba(30,45,90,.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font-ui); background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; color: inherit; }
  .brand .logo {
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hi)); color: var(--accent-ink);
  }
  .brand .name b { color: var(--accent); }
  .brand .tag { font-size: 11.5px; color: var(--dim); font-weight: 400; margin-left: 2px; }
  .toolnav { display: flex; gap: 3px; margin-left: 4px; flex-wrap: wrap; }
  .toolnav a {
    padding: 4px 10px; border-radius: 7px; font-size: 12.5px; color: var(--dim);
    text-decoration: none; border: 1px solid transparent; transition: background .15s, color .15s;
  }
  .toolnav a:hover { background: var(--bg-3); color: var(--text); }
  .toolnav a.active { background: var(--bg-3); color: var(--accent); font-weight: 600; border-color: var(--border); }
  .topbar .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
    font-size: 13px; font-weight: 500; transition: background .15s, border-color .15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--bg-3); border-color: var(--border-2); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-hi));
    color: var(--accent-ink); border-color: transparent; font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost-icon { padding: 7px; }

  /* Main workspace */
  .workspace { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px 16px; gap: 10px; overflow: hidden; }

  /* Request bar */
  .req-bar { display: flex; gap: 8px; flex: 0 0 auto; }
  .method-select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-2); color: var(--accent); font-family: var(--font-mono);
    font-size: 13px; font-weight: 700; cursor: pointer; min-width: 100px;
  }
  .url-input {
    flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-2); color: var(--text); font-family: var(--font-mono); font-size: 13px;
  }
  .url-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,162,92,.15); }
  .url-input::placeholder { color: var(--faint); }

  /* Panels */
  .panels { flex: 1; display: flex; gap: 10px; min-height: 0; }
  .panel {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-3); flex: 0 0 auto;
  }
  .panel-title { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; }
  .tab {
    padding: 5px 12px; border-radius: 6px; font-size: 12.5px; color: var(--dim);
    cursor: pointer; border: 1px solid transparent; background: transparent; transition: all .15s;
  }
  .tab:hover { color: var(--text); background: var(--bg-4); }
  .tab.active { color: var(--accent); background: var(--bg-4); font-weight: 600; border-color: var(--border); }

  /* Tab content */
  .tab-content { flex: 1; min-height: 0; display: none; flex-direction: column; padding: 10px 12px; overflow-y: auto; }
  .tab-content.active { display: flex; }

  /* KV editor */
  .kv-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .kv-row input {
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 12.5px;
  }
  .kv-row input:focus { outline: none; border-color: var(--accent); }
  .kv-row .k { flex: 1; min-width: 0; }
  .kv-row .v { flex: 2; min-width: 0; }
  .kv-del {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--faint); cursor: pointer; display: grid; place-items: center;
    font-size: 14px; flex: 0 0 auto;
  }
  .kv-del:hover { color: var(--err); border-color: var(--err); }
  .kv-add {
    padding: 5px 12px; border-radius: 6px; border: 1px dashed var(--border-2);
    background: transparent; color: var(--dim); font-size: 12px; cursor: pointer;
    align-self: flex-start; margin-top: 4px;
  }
  .kv-add:hover { color: var(--accent); border-color: var(--accent); }

  /* Body editor */
  .body-type { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .body-type label {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    font-size: 12px; color: var(--dim); cursor: pointer; transition: all .15s;
  }
  .body-type input[type="radio"] { display: none; }
  .body-type input[type="radio"]:checked + span { color: var(--accent); }
  .body-type label:has(input:checked) { border-color: var(--accent); background: var(--bg-4); }
  .body-textarea {
    flex: 1; min-height: 0; width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-family: var(--font-mono); font-size: 12.5px; resize: none; line-height: 1.6;
  }
  .body-textarea:focus { outline: none; border-color: var(--accent); }
  .body-hint { font-size: 11px; color: var(--faint); margin-top: 6px; }

  /* Auth */
  .auth-field { margin-bottom: 10px; }
  .auth-field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .auth-field input {
    width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 12.5px;
  }

  /* Response */
  .resp-status {
    display: flex; align-items: center; gap: 12px; padding: 6px 0;
  }
  .status-badge {
    padding: 3px 10px; border-radius: 6px; font-family: var(--font-mono);
    font-size: 13px; font-weight: 700;
  }
  .status-badge.ok { background: rgba(123,211,154,.15); color: var(--ok); }
  .status-badge.err { background: rgba(240,131,124,.15); color: var(--err); }
  .status-badge.warn { background: rgba(240,198,116,.15); color: var(--warn); }
  .resp-meta { font-size: 12px; color: var(--dim); font-family: var(--font-mono); }

  .resp-body {
    flex: 1; min-height: 0; overflow: auto; padding: 10px 12px;
    font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
  }
  .resp-body .tok-key { color: var(--tok-key); }
  .resp-body .tok-str { color: var(--tok-str); }
  .resp-body .tok-num { color: var(--tok-num); }
  .resp-body .tok-bool { color: var(--tok-bool); }
  .resp-body .tok-null { color: var(--tok-null); }

  /* Tree view */
  .resp-subtabs { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-3); flex: 0 0 auto; }
  .subtab { padding: 3px 10px; border-radius: 5px; font-size: 11.5px; color: var(--dim); cursor: pointer; border: 1px solid transparent; background: transparent; transition: all .15s; }
  .subtab:hover { color: var(--text); background: var(--bg-4); }
  .subtab.active { color: var(--accent); background: var(--bg-4); font-weight: 600; border-color: var(--border); }
  .tree-view { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; padding: 8px 12px; }
  .tree-row { position: relative; }
  .tree-row .tree-line { display: flex; align-items: baseline; gap: 4px; padding: 1px 0; border-radius: 4px; }
  .tree-row .tree-line:hover { background: var(--bg-3); }
  .tree-caret {
    width: 16px; height: 16px; display: inline-grid; place-items: center;
    border: none; background: transparent; color: var(--faint); cursor: pointer;
    font-size: 9px; transition: transform .15s; flex: 0 0 auto; padding: 0;
  }
  .tree-caret.open { transform: rotate(90deg); }
  .tree-caret-spacer { width: 16px; flex: 0 0 auto; display: inline-block; }
  .tree-key { color: var(--tok-key); font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .tree-sep { color: var(--faint); }
  .tree-val-str { color: var(--tok-str); word-break: break-all; overflow-wrap: anywhere; }
  .tree-val-num { color: var(--tok-num); }
  .tree-val-bool { color: var(--tok-bool); }
  .tree-val-null { color: var(--tok-null); font-style: italic; }
  .tree-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600;
    background: var(--bg-4); color: var(--dim); margin-left: 2px;
  }
  .tree-badge.object { color: var(--tok-key); }
  .tree-badge.array { color: var(--tok-bool); }
  .tree-preview { color: var(--faint); font-size: 11px; margin-left: 4px; }
  .tree-children { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 8px; }
  .tree-children.collapsed { display: none; }
  .resp-headers { flex: 1; overflow: auto; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; }
  .resp-headers .hdr-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .resp-headers .hdr-k { color: var(--tok-key); font-weight: 600; min-width: 160px; }
  .resp-headers .hdr-v { color: var(--dim); word-break: break-all; }

  .empty-state {
    flex: 1; display: grid; place-items: center; color: var(--faint);
    font-size: 14px; text-align: center;
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 8px; opacity: .5; }

  /* cURL modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; width: 90%; max-width: 640px; box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal textarea {
    width: 100%; min-height: 140px; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-family: var(--font-mono); font-size: 12px; resize: vertical;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .modal-error { color: var(--err); font-size: 12.5px; margin-top: 8px; min-height: 18px; }

  /* History modal */
  .modal-wide { max-width: 760px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .modal-head h3 { margin: 0; font-size: 16px; }
  #historyList { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .history-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s;
  }
  .history-row:hover { background: var(--bg-3); border-color: var(--border); }
  .method-badge {
    padding: 2px 8px; border-radius: 5px; font-family: var(--font-mono);
    font-size: 11px; font-weight: 700; flex: 0 0 auto;
  }
  .method-badge.m-get { color: var(--ok); background: rgba(123,211,154,.12); }
  .method-badge.m-post { color: var(--warn); background: rgba(240,198,116,.12); }
  .method-badge.m-put { color: var(--tok-key); background: rgba(134,185,240,.12); }
  .method-badge.m-delete { color: var(--err); background: rgba(240,131,124,.12); }
  .method-badge.m-patch, .method-badge.m-head, .method-badge.m-options { color: var(--accent); background: rgba(232,162,92,.12); }
  .hist-url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; }
  .hist-time { color: var(--faint); font-size: 11.5px; font-family: var(--font-mono); flex: 0 0 auto; }
  .hist-count { color: var(--dim); font-size: 11px; background: var(--bg-4); border-radius: 4px; padding: 1px 6px; flex: 0 0 auto; }
  .hist-del { width: 24px; height: 24px; flex: 0 0 auto; }
  #histCount { color: var(--dim); font-weight: 500; }

  /* Response copy button */
  .btn-copy { transition: color .15s, border-color .15s, background .15s; }
  .btn-copy.copied { color: var(--ok); border-color: var(--ok); background: rgba(123,211,154,.1); }
  .btn-copy.failed { color: var(--err); border-color: var(--err); background: rgba(240,131,124,.1); }

  /* Status bar */
  .statusbar {
    display: flex; align-items: center; gap: 12px; padding: 6px 16px;
    border-top: 1px solid var(--border); background: var(--bg); flex: 0 0 auto;
    font-size: 11.5px; color: var(--faint); font-family: var(--font-mono);
  }
  .statusbar .pill { padding: 2px 8px; border-radius: 4px; background: var(--bg-3); }
  .statusbar .spacer { flex: 1; }

  .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--faint); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .panels { flex-direction: column; }
    .brand .tag { display: none; }
  }
</style>
</head>

<div class="workspace">
  <!-- Request bar -->
  <div class="req-bar">
    <select class="method-select" id="method">
      <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
      <option>PATCH</option><option>HEAD</option><option>OPTIONS</option>
    </select>
    <input class="url-input" id="url" type="text" placeholder="https://api.example.com/endpoint" autocomplete="off" spellcheck="false">
    <button class="btn" id="btnCurl" title="Import cURL command">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>

        <span class="panel-title">Request</span>
        <div class="tabs">
          <button class="tab active" data-tab="headers">Headers</button>
          <button class="tab" data-tab="body">Body</button>
          <button class="tab" data-tab="auth">Auth</button>
        </div>
      </div>
      <div class="panel-body">
        <!-- Headers tab -->
        <div class="tab-content active" id="tab-headers">
          <div id="headersList"></div>
          <button class="kv-add" id="addHeader">+ Add Header</button>
        </div>
        <!-- Body tab -->
        <div class="tab-content" id="tab-body">
          <div class="body-type">
            <label><input type="radio" name="bodyType" value="none" checked><span>None</span></label>
            <label><input type="radio" name="bodyType" value="json"><span>JSON</span></label>
            <label><input type="radio" name="bodyType" value="form"><span>x-www-form-urlencoded</span></label>
            <label><input type="radio" name="bodyType" value="text"><span>Raw</span></label>
          </div>
          <textarea class="body-textarea" id="bodyInput" placeholder="Request body..." spellcheck="false" style="display:none"></textarea>
          <div id="formBody" style="display:none;flex:1;flex-direction:column;overflow-y:auto;">
            <div id="formList"></div>
            <button class="kv-add" id="addFormField">+ Add Field</button>
          </div>
          <div class="body-hint" id="bodyHint"></div>
        </div>
        <!-- Auth tab -->
        <div class="tab-content" id="tab-auth">
          <div class="body-type">
            <label><input type="radio" name="authType" value="none" checked><span>None</span></label>
            <label><input type="radio" name="authType" value="bearer"><span>Bearer Token</span></label>
            <label><input type="radio" name="authType" value="basic"><span>Basic Auth</span></label>
          </div>
          <div id="bearerFields" style="display:none;">
            <div class="auth-field"><label>Token</label><input type="text" id="bearerToken" placeholder="eyJhbGciOi..."></div>
          </div>
          <div id="basicFields" style="display:none;">
            <div class="auth-field"><label>Username</label><input type="text" id="basicUser"></div>
            <div class="auth-field"><label>Password</label><input type="password" id="basicPass"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Response panel -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Response</span>
        <div class="resp-status" id="respStatus" style="display:none;">
          <span class="status-badge" id="statusBadge"></span>
          <span class="resp-meta" id="respMeta"></span>
        </div>
        <div class="spacer" style="flex:1"></div>
        <button class="btn ghost-icon btn-copy" id="btnCopyResp" title="Copy response" style="display:none">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <div class="tabs" id="respTabs" style="display:none;">
          <button class="tab active" data-rtab="body">Body</button>
          <button class="tab" data-rtab="headers">Headers</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="empty-state" id="respEmpty">
          <div>
            <div class="icon">📡</div>
            <div>Send a request to see the response here</div>
          </div>
        </div>
        <div class="tab-content active" id="rtab-body" style="display:none;">
          <div class="resp-subtabs" id="respSubtabs" style="display:none;">
            <button class="subtab active" data-view="formatted">Formatted</button>
            <button class="subtab" data-view="tree">Tree</button>
          </div>
          <div class="resp-body tree-view" id="respTree"></div>
          <div class="resp-body" id="respFormatted" style="display:none;"></div>
        </div>
        <div class="tab-content" id="rtab-headers" style="display:none;">
          <div class="resp-headers" id="respHeaders"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span class="pill" id="statStatus">Ready</span>
  <span class="spacer"></span>
  <span>Requests go through WeUtil proxy to bypass CORS</span>
</div>

<!-- cURL import modal -->
<div class="modal-overlay" id="curlModal">
  <div class="modal">
    <h3>Import cURL Command</h3>
    <textarea id="curlInput" placeholder='curl -X POST https://api.example.com/users -H "Content-Type: application/json" -d &#39;{"name":"John"}&#39;'></textarea>
    <div class="modal-error" id="curlError"></div>
    <div class="modal-actions">
      <button class="btn" id="curlCancel">Cancel</button>
      <button class="btn primary" id="curlImport">Import</button>
    </div>
  </div>
</div>

<!-- History modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal modal-wide">
    <div class="modal-head">
      <h3>Request History</h3>
      <button class="btn" id="historyClear" style="display:none">Clear All</button>
    </div>
    <div id="historyList"></div>
    <div class="modal-actions">
      <button class="btn" id="historyClose">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var PROXY_ENDPOINT = '/api/proxy';
  var $ = function (id) { return document.getElementById(id); };

  // ===== Theme toggle =====
  $('btnTheme').addEventListener('click', function () {
    var html = document.documentElement;
    var dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    $('iconSun').style.display = dark ? 'none' : '';
    $('iconMoon').style.display = dark ? '' : 'none';
  });

  // ===== Tabs =====
  document.querySelectorAll('.tab[data-tab]').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab[data-tab]').forEach(function (t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
      tab.classList.add('active');
      $('tab-' + tab.dataset.tab).classList.add('active');
    });
  });
  document.querySelectorAll('.tab[data-rtab]').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab[data-rtab]').forEach(function (t) { t.classList.remove('active'); });
      document.querySelectorAll('[id^="rtab-"]').forEach(function (c) { c.style.display = 'none'; });
      tab.classList.add('active');
      $('rtab-' + tab.dataset.rtab).style.display = 'flex';
    });
  });

  // ===== KV editor (Headers) =====
  function createKvRow(key, val, container, onDelete) {
    var row = document.createElement('div');
    row.className = 'kv-row';
    row.innerHTML = '<input class="k" type="text" placeholder="Key" value="' + esc(key) + '">' +
      '<input class="v" type="text" placeholder="Value" value="' + esc(val) + '">' +
      '<button class="kv-del" title="Remove">×</button>';
    row.querySelector('.kv-del').addEventListener('click', function () { row.remove(); if (onDelete) onDelete(); });
    container.appendChild(row);
    return row;
  }
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  var headersList = $('headersList');
  $('addHeader').addEventListener('click', function () { createKvRow('', '', headersList); });
  createKvRow('Content-Type', 'application/json', headersList);

  // ===== Form body KV editor =====
  var formList = $('formList');
  $('addFormField').addEventListener('click', function () { createKvRow('', '', formList); });

  // ===== Body type toggle =====
  document.querySelectorAll('input[name="bodyType"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      var type = radio.value;
      $('bodyInput').style.display = (type === 'json' || type === 'text') ? 'block' : 'none';
      $('formBody').style.display = (type === 'form') ? 'flex' : 'none';
      if (type === 'json') {
        $('bodyInput').placeholder = '{\n  "key": "value"\n}';
        $('bodyHint').textContent = 'Content-Type: application/json will be set automatically';
      } else if (type === 'text') {
        $('bodyInput').placeholder = 'Raw body text...';
        $('bodyHint').textContent = '';
      } else if (type === 'form') {
        $('bodyHint').textContent = 'Content-Type: application/x-www-form-urlencoded will be set automatically';
      } else {
        $('bodyHint').textContent = '';
      }
    });
  });

  // ===== Auth type toggle =====
  document.querySelectorAll('input[name="authType"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      var type = radio.value;
      $('bearerFields').style.display = (type === 'bearer') ? 'block' : 'none';
      $('basicFields').style.display = (type === 'basic') ? 'block' : 'none';
    });
  });

  // ===== Collect request data =====
  function collectRequest() {
    var method = $('method').value;
    var url = $('url').value.trim();
    var headers = {};
    headersList.querySelectorAll('.kv-row').forEach(function (row) {
      var k = row.querySelector('.k').value.trim();
      var v = row.querySelector('.v').value.trim();
      if (k) headers[k] = v;
    });

    var bodyType = document.querySelector('input[name="bodyType"]:checked').value;
    var body = null;
    if (bodyType === 'json' || bodyType === 'text') {
      body = $('bodyInput').value;
      if (bodyType === 'json' && body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    } else if (bodyType === 'form') {
      var params = new URLSearchParams();
      formList.querySelectorAll('.kv-row').forEach(function (row) {
        var k = row.querySelector('.k').value.trim();
        var v = row.querySelector('.v').value;
        if (k) params.append(k, v);
      });
      body = params.toString();
      if (!headers['Content-Type']) headers['Content-Type'] = 'application/x-www-form-urlencoded';
    }

    var authType = document.querySelector('input[name="authType"]:checked').value;
    if (authType === 'bearer') {
      var token = $('bearerToken').value.trim();
      if (token) headers['Authorization'] = 'Bearer ' + token;
    } else if (authType === 'basic') {
      var u = $('basicUser').value;
      var p = $('basicPass').value;
      if (u) headers['Authorization'] = 'Basic ' + btoa(u + ':' + p);
    }

    return { method: method, url: url, headers: headers, body: body };
  }

  // ===== Send request =====
  $('btnSend').addEventListener('click', sendRequest);
  $('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendRequest(); });

  async function sendRequest() {
    var req = collectRequest();
    var state = collectState();
    if (!req.url) { alert('Please enter a URL'); return; }
    if (!/^https?:\/\//i.test(req.url)) {
      req.url = 'https://' + req.url;
      $('url').value = req.url;
    }

    var btn = $('btnSend');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span> Sending...';
    $('statStatus').textContent = 'Sending...';
    $('respEmpty').style.display = 'none';
    $('respStatus').style.display = 'none';
    $('respTabs').style.display = 'none';
    $('rtab-body').style.display = 'none';
    $('rtab-headers').style.display = 'none';
    $('respTree').innerHTML = '';
    $('respFormatted').innerHTML = '';
    $('respSubtabs').style.display = 'none';
    $('respHeaders').innerHTML = '';

    try {
      var startTime = performance.now();
      var res = await fetch(PROXY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(req)
      });
      var data = await res.json();
      var elapsed = Math.round(performance.now() - startTime);

      if (data.error) {
        showError(data.error, elapsed);
      } else {
        showResponse(data, elapsed);
        saveHistory(state);
      }
    } catch (err) {
      showError('Proxy error: ' + err.message, null);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send';
    }
  }

  function showResponse(data, elapsed) {
    $('respStatus').style.display = 'flex';
    $('respTabs').style.display = 'flex';
    $('rtab-body').style.display = 'flex';
    $('btnCopyResp').style.display = '';
    lastRawBody = data.body;

    var badge = $('statusBadge');
    var status = data.status;
    badge.textContent = status + ' ' + (data.statusText || '');
    badge.className = 'status-badge ' + (status >= 200 && status < 300 ? 'ok' : status >= 400 ? 'err' : 'warn');

    var sizeKb = (data.bodySize / 1024).toFixed(1);
    $('respMeta').textContent = (data.time || elapsed) + 'ms · ' + sizeKb + ' KB';
    $('statStatus').textContent = status + ' ' + (data.statusText || '') + ' · ' + (data.time || elapsed) + 'ms';

    // Body
    var ct = (data.headers['content-type'] || data.headers['Content-Type'] || '').toLowerCase();
    var isJson = ct.includes('json') && data.body;
    if (isJson) {
      try {
        lastParsedResponse = JSON.parse(data.body);
        $('respTree').innerHTML = renderTreeFromParsed(lastParsedResponse, true);
        $('respFormatted').innerHTML = syntaxHighlight(JSON.stringify(lastParsedResponse, null, 2));
        $('respSubtabs').style.display = 'flex';
        $('respTree').style.display = 'none';
        $('respFormatted').style.display = '';
        document.querySelectorAll('.subtab').forEach(function (t) { t.classList.remove('active'); });
        document.querySelector('.subtab[data-view="formatted"]').classList.add('active');
      } catch {
        lastParsedResponse = null;
        $('respTree').textContent = data.body;
        $('respFormatted').textContent = data.body;
        $('respSubtabs').style.display = 'none';
      }
    } else {
      lastParsedResponse = null;
      $('respTree').textContent = data.body || '(empty response body)';
      $('respFormatted').textContent = data.body || '(empty response body)';
      $('respSubtabs').style.display = 'none';
    }
    if (data.truncated) {
      $('respFormatted').textContent += '\n\n[Response truncated: exceeds 10MB limit]';
    }

    // Headers
    var hdrHtml = '';
    Object.entries(data.headers).forEach(function (_ref) {
      var k = _ref[0], v = _ref[1];
      hdrHtml += '<div class="hdr-row"><span class="hdr-k">' + esc(k) + '</span><span class="hdr-v">' + esc(v) + '</span></div>';
    });
    $('respHeaders').innerHTML = hdrHtml || '(no headers)';
  }

  function showError(msg, elapsed) {
    $('respStatus').style.display = 'flex';
    $('btnCopyResp').style.display = '';
    lastRawBody = msg;
    var badge = $('statusBadge');
    badge.textContent = 'Error';
    badge.className = 'status-badge err';
    $('respMeta').textContent = elapsed ? elapsed + 'ms' : '';
    $('respTabs').style.display = 'flex';
    $('rtab-body').style.display = 'flex';
    $('respSubtabs').style.display = 'none';
    $('respTree').textContent = msg;
    $('respFormatted').textContent = msg;
    $('respTree').style.display = '';
    $('respFormatted').style.display = 'none';
    $('statStatus').textContent = 'Error';
  }

  function syntaxHighlight(json) {
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
      var cls = 'tok-num';
      if (/^"/.test(match)) { cls = /:$/.test(match) ? 'tok-key' : 'tok-str'; }
      else if (/true|false/.test(match)) { cls = 'tok-bool'; }
      else if (/null/.test(match)) { cls = 'tok-null'; }
      return '<span class="' + cls + '">' + match + '</span>';
    });
  }

  // ===== JSON Tree view =====
  var lastParsedResponse = null;
  var lastRawBody = '';
  var treeExpanded = new Set();

  function typeOf(v) {
    if (v === null) return 'null';
    if (Array.isArray(v)) return 'array';
    return typeof v;
  }

  function treePathKey(path) {
    if (!path.length) return '$';
    return path.map(function (p) { return typeof p === 'number' ? '[' + p + ']' : '.' + p; }).join('');
  }

  function renderTreeNode(key, value, path, isRoot) {
    var t = typeOf(value);
    var pkey = treePathKey(path);
    var keyHtml = isRoot
      ? '<span class="tree-key" style="color:var(--accent);font-weight:700">$</span>'
      : '<span class="tree-key">' + esc(String(key)) + '</span>';

    if (t === 'object' || t === 'array') {
      var isArr = t === 'array';
      var entries = isArr
        ? value.map(function (v, i) { return [i, v]; })
        : Object.keys(value).map(function (k) { return [k, value[k]]; });
      var open = treeExpanded.has(pkey);
      var badge = '<span class="tree-badge ' + t + '">' + (isArr ? 'array[' + entries.length + ']' : 'object{' + entries.length + '}') + '</span>';
      var preview = open ? '' : '<span class="tree-preview">' + (isArr ? '[…]' : '{…}') + '</span>';
      var caret = '<button class="tree-caret' + (open ? ' open' : '') + '" data-path="' + esc(pkey) + '" aria-label="Toggle">▶</button>';
      var children = '';
      if (open && entries.length > 0) {
        children = '<div class="tree-children">' + entries.map(function (e) {
          return renderTreeNode(e[0], e[1], path.concat(e[0]), false);
        }).join('') + '</div>';
      }
      return '<div class="tree-row" data-path="' + esc(pkey) + '">' +
        '<div class="tree-line">' + caret + keyHtml + '<span class="tree-sep">:</span>' + badge + preview + '</div>' +
        children + '</div>';
    }

    var valClass = 'tree-val-' + t;
    var valHtml = '';
    if (t === 'string') valHtml = '<span class="' + valClass + '">"' + esc(value) + '"</span>';
    else if (t === 'number') valHtml = '<span class="' + valClass + '">' + value + '</span>';
    else if (t === 'boolean') valHtml = '<span class="' + valClass + '">' + value + '</span>';
    else valHtml = '<span class="' + valClass + '">null</span>';

    return '<div class="tree-row">' +
      '<div class="tree-line"><span class="tree-caret-spacer"></span>' + keyHtml + '<span class="tree-sep">:</span>' + valHtml + '</div></div>';
  }

  function renderTreeFromParsed(parsed, isFirst) {
    if (isFirst) {
      treeExpanded.clear();
      treeExpanded.add('$');
      var t = typeOf(parsed);
      if (t === 'object' || t === 'array') {
        var entries = t === 'array'
          ? parsed.map(function (v, i) { return [i, v]; })
          : Object.keys(parsed).map(function (k) { return [k, parsed[k]]; });
        entries.forEach(function (e) {
          if (typeOf(e[1]) === 'object' || typeOf(e[1]) === 'array') {
            treeExpanded.add(treePathKey([e[0]]));
          }
        });
      }
    }
    return renderTreeNode(null, parsed, [], true);
  }

  // Tree caret click (re-render to preserve state)
  $('respTree').addEventListener('click', function (e) {
    var caret = e.target.closest('.tree-caret');
    if (!caret || !lastParsedResponse) return;
    var path = caret.dataset.path;
    if (treeExpanded.has(path)) treeExpanded.delete(path);
    else treeExpanded.add(path);
    $('respTree').innerHTML = renderTreeFromParsed(lastParsedResponse, false);
  });

  // Tree / Raw subtab switch
  document.querySelectorAll('.subtab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.subtab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var view = tab.dataset.view;
      $('respTree').style.display = (view === 'tree') ? '' : 'none';
      $('respFormatted').style.display = (view === 'formatted') ? '' : 'none';
    });
  });

  // ===== cURL parser =====
  function parseCurl(cmd) {
    // Normalize: remove line continuations
    cmd = cmd.replace(/\\\r?\n/g, ' ').trim();
    if (!/^curl\s/i.test(cmd)) throw new Error('Command must start with "curl"');
    cmd = cmd.replace(/^curl\s+/i, '');

    var result = { method: 'GET', url: '', headers: {}, body: null, bodyType: 'none' };
    var methodExplicit = false;
    var tokens = tokenize(cmd);

    for (var i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      if (tok === '-X' || tok === '--request') {
        result.method = tokens[++i].toUpperCase();
        methodExplicit = true;
      } else if (tok === '-H' || tok === '--header') {
        var hdr = tokens[++i];
        var colon = hdr.indexOf(':');
        if (colon > 0) {
          var k = hdr.substring(0, colon).trim();
          var v = hdr.substring(colon + 1).trim();
          result.headers[k] = v;
        }
      } else if (tok === '-b' || tok === '--cookie') {
        result.headers['Cookie'] = tokens[++i];
      } else if (tok === '-d' || tok === '--data' || tok === '--data-raw' || tok === '--data-binary') {
        result.body = tokens[++i];
        result.bodyType = 'raw';
        if (!methodExplicit) result.method = 'POST';
        if (!result.headers['Content-Type']) result.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      } else if (tok === '--data-urlencode') {
        result.body = (result.body ? result.body + '&' : '') + tokens[++i];
        result.bodyType = 'form';
        if (!methodExplicit) result.method = 'POST';
        if (!result.headers['Content-Type']) result.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      } else if (tok === '-u' || tok === '--user') {
        result.headers['Authorization'] = 'Basic ' + btoa(tokens[++i]);
      } else if (tok === '--url') {
        result.url = tokens[++i];
      } else if (tok === '-F' || tok === '--form') {
        result.body = (result.body ? result.body + '&' : '') + tokens[++i];
        result.bodyType = 'form';
        if (!methodExplicit) result.method = 'POST';
        if (!result.headers['Content-Type']) result.headers['Content-Type'] = 'multipart/form-data';
      } else if (tok === '-i' || tok === '--include' || tok === '-v' || tok === '--verbose' || tok === '-k' || tok === '--insecure' || tok === '-L' || tok === '--location' || tok === '-s' || tok === '--silent') {
        // ignore
      } else if (tok.startsWith('--')) {
        // unknown long flag, skip value if next token isn't a flag
        if (tokens[i + 1] && !tokens[i + 1].startsWith('-') && !tokens[i + 1].startsWith('http')) i++;
      } else if (!tok.startsWith('-')) {
        if (!result.url) result.url = tok;
      }
    }

    if (!result.url) throw new Error('Could not find URL in cURL command');

    // Detect JSON body
    if (result.body && result.body.trim().startsWith('{')) {
      result.bodyType = 'json';
      result.headers['Content-Type'] = 'application/json';
    }

    return result;
  }

  function tokenize(str) {
    var tokens = [];
    var current = '';
    var inSingle = false, inDouble = false;
    for (var i = 0; i < str.length; i++) {
      var c = str[i];
      if (inSingle) {
        if (c === "'") inSingle = false;
        else current += c;
      } else if (inDouble) {
        if (c === '"') inDouble = false;
        else if (c === '\\' && i + 1 < str.length) { current += str[++i]; }
        else current += c;
      } else {
        if (c === "'") inSingle = true;
        else if (c === '"') inDouble = true;
        else if (c === ' ' || c === '\t') {
          if (current) { tokens.push(current); current = ''; }
        } else current += c;
      }
    }
    if (current) tokens.push(current);
    return tokens;
  }

  // ===== cURL modal =====
  var curlModal = $('curlModal');
  $('btnCurl').addEventListener('click', function () {
    curlModal.classList.add('show');
    $('curlInput').value = '';
    $('curlError').textContent = '';
    setTimeout(function () { $('curlInput').focus(); }, 50);
  });
  $('curlCancel').addEventListener('click', function () { curlModal.classList.remove('show'); });
  curlModal.addEventListener('click', function (e) { if (e.target === curlModal) curlModal.classList.remove('show'); });

  $('curlImport').addEventListener('click', function () {
    var cmd = $('curlInput').value.trim();
    if (!cmd) { $('curlError').textContent = 'Please paste a cURL command'; return; }
    try {
      var parsed = parseCurl(cmd);
      applyParsed(parsed);
      curlModal.classList.remove('show');
    } catch (err) {
      $('curlError').textContent = err.message;
    }
  });

  function applyParsed(parsed) {
    $('method').value = parsed.method;
    $('url').value = parsed.url;

    // Clear and set headers
    headersList.innerHTML = '';
    var hasCT = false;
    Object.entries(parsed.headers).forEach(function (_ref) {
      var k = _ref[0], v = _ref[1];
      if (k.toLowerCase() === 'content-type') hasCT = true;
      createKvRow(k, v, headersList);
    });
    if (!hasCT && parsed.bodyType === 'json') createKvRow('Content-Type', 'application/json', headersList);
    if (!headersList.children.length) createKvRow('', '', headersList);

    // Set body
    if (parsed.body) {
      if (parsed.bodyType === 'json') {
        document.querySelector('input[name="bodyType"][value="json"]').checked = true;
        $('bodyInput').style.display = 'block';
        $('formBody').style.display = 'none';
        try { $('bodyInput').value = JSON.stringify(JSON.parse(parsed.body), null, 2); }
        catch { $('bodyInput').value = parsed.body; }
      } else if (parsed.bodyType === 'form') {
        document.querySelector('input[name="bodyType"][value="form"]').checked = true;
        $('bodyInput').style.display = 'none';
        $('formBody').style.display = 'flex';
        formList.innerHTML = '';
        try {
          var params = new URLSearchParams(parsed.body);
          params.forEach(function (v, k) { createKvRow(k, v, formList); });
        } catch { createKvRow('', '', formList); }
      } else {
        document.querySelector('input[name="bodyType"][value="text"]').checked = true;
        $('bodyInput').style.display = 'block';
        $('formBody').style.display = 'none';
        $('bodyInput').value = parsed.body;
      }
    } else {
      document.querySelector('input[name="bodyType"][value="none"]').checked = true;
      $('bodyInput').style.display = 'none';
      $('formBody').style.display = 'none';
    }
  }

  // ===== Request history =====
  var HISTORY_KEY = 'weutil.http.history.v1';
  var HISTORY_MAX = 100;

  // Collect full editable form state (headers/auth kept separate so the UI can be restored exactly)
  function collectState() {
    var headerRows = [];
    headersList.querySelectorAll('.kv-row').forEach(function (row) {
      var k = row.querySelector('.k').value.trim();
      var v = row.querySelector('.v').value;
      if (k) headerRows.push({ k: k, v: v });
    });
    var formRows = [];
    formList.querySelectorAll('.kv-row').forEach(function (row) {
      var k = row.querySelector('.k').value.trim();
      var v = row.querySelector('.v').value;
      if (k) formRows.push({ k: k, v: v });
    });
    var bodyType = document.querySelector('input[name="bodyType"]:checked').value;
    var authType = document.querySelector('input[name="authType"]:checked').value;
    var auth = {};
    if (authType === 'bearer') auth.token = $('bearerToken').value;
    else if (authType === 'basic') { auth.user = $('basicUser').value; auth.pass = $('basicPass').value; }
    return {
      method: $('method').value,
      url: $('url').value.trim(),
      headerRows: headerRows,
      formRows: formRows,
      bodyType: bodyType,
      bodyText: (bodyType === 'json' || bodyType === 'text') ? $('bodyInput').value : '',
      authType: authType,
      auth: auth
    };
  }

  // Restore a saved state back into the form
  function applyState(s) {
    $('method').value = s.method;
    $('url').value = s.url;
    headersList.innerHTML = '';
    (s.headerRows || []).forEach(function (r) { createKvRow(r.k, r.v, headersList); });
    if (!headersList.children.length) createKvRow('', '', headersList);
    formList.innerHTML = '';
    (s.formRows || []).forEach(function (r) { createKvRow(r.k, r.v, formList); });

    var bt = s.bodyType || 'none';
    document.querySelector('input[name="bodyType"][value="' + bt + '"]').checked = true;
    $('bodyInput').style.display = (bt === 'json' || bt === 'text') ? 'block' : 'none';
    $('formBody').style.display = (bt === 'form') ? 'flex' : 'none';
    $('bodyInput').placeholder = bt === 'json' ? '{\n  "key": "value"\n}' : 'Raw body text...';
    $('bodyHint').textContent = bt === 'json' ? 'Content-Type: application/json will be set automatically'
      : bt === 'form' ? 'Content-Type: application/x-www-form-urlencoded will be set automatically' : '';
    if (bt === 'json' || bt === 'text') $('bodyInput').value = s.bodyText || '';

    var at = s.authType || 'none';
    document.querySelector('input[name="authType"][value="' + at + '"]').checked = true;
    $('bearerFields').style.display = (at === 'bearer') ? 'block' : 'none';
    $('basicFields').style.display = (at === 'basic') ? 'block' : 'none';
    if (at === 'bearer') $('bearerToken').value = (s.auth && s.auth.token) || '';
    else if (at === 'basic') {
      $('basicUser').value = (s.auth && s.auth.user) || '';
      $('basicPass').value = (s.auth && s.auth.pass) || '';
    }
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch (e) { return []; }
  }
  function setHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
    catch (e) { /* storage quota exceeded: keep existing history */ }
  }
  function fingerprintOf(s) {
    var src = JSON.stringify([s.method, s.url, s.headerRows, s.bodyType, s.bodyText, s.formRows]);
    var h = 0;
    for (var i = 0; i < src.length; i++) { h = ((h << 5) - h + src.charCodeAt(i)) | 0; }
    return String(h);
  }

  function saveHistory(s) {
    if (!s || !s.url) return;
    var list = getHistory();
    var fp = fingerprintOf(s);
    var now = Date.now();
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].fp === fp) { idx = i; break; }
    }
    if (idx >= 0) {
      var rec = list[idx];
      rec.ts = now; rec.count = (rec.count || 1) + 1;
      list.splice(idx, 1); list.unshift(rec);
    } else {
      list.unshift({
        id: now.toString(36) + Math.random().toString(36).slice(2, 6),
        method: s.method, url: s.url, headerRows: s.headerRows,
        bodyType: s.bodyType, bodyText: s.bodyText, formRows: s.formRows,
        authType: s.authType, auth: s.auth, fp: fp, ts: now, count: 1
      });
      if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
    }
    setHistory(list);
    renderHistoryBadge();
  }

  function deleteHistory(id) {
    setHistory(getHistory().filter(function (r) { return r.id !== id; }));
    renderHistoryList();
    renderHistoryBadge();
  }

  function loadHistory(id) {
    var list = getHistory();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { applyState(list[i]); break; }
    }
    $('historyModal').classList.remove('show');
  }

  function timeAgo(ts) {
    var diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 2592000000) return Math.floor(diff / 86400000) + 'd ago';
    return new Date(ts).toLocaleDateString();
  }

  function renderHistoryBadge() {
    var n = getHistory().length;
    $('histCount').textContent = n ? ' (' + n + ')' : '';
  }

  // Prefill the form with the most recent request on load
  function loadMostRecent() {
    var list = getHistory();
    if (list.length) applyState(list[0]);
  }

  function copyToClipboard(text, btn) {
    function flash(ok) {
      var svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
      btn.innerHTML = ok ? '✓' : '✕';
      btn.classList.remove('copied', 'failed');
      btn.classList.add(ok ? 'copied' : 'failed');
      setTimeout(function () { btn.innerHTML = svg; btn.classList.remove('copied', 'failed'); }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }).catch(function () { flash(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      flash(ok);
    }
  }

  $('btnCopyResp').addEventListener('click', function () {
    if (!lastRawBody && lastRawBody !== '') return;
    var text = lastParsedResponse !== null ? JSON.stringify(lastParsedResponse, null, 2) : lastRawBody;
    copyToClipboard(text, $('btnCopyResp'));
  });

  function renderHistoryList() {
    var list = getHistory();
    var box = $('historyList');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="empty-state" style="padding:40px 0"><div><div class="icon">🕘</div><div>No history yet. Sent requests will appear here.</div></div></div>';
      $('historyClear').style.display = 'none';
      return;
    }
    $('historyClear').style.display = '';
    list.forEach(function (rec) {
      var row = document.createElement('div');
      row.className = 'history-row';
      var badgeCls = 'm-' + rec.method.toLowerCase();
      row.innerHTML =
        '<span class="method-badge ' + badgeCls + '">' + esc(rec.method) + '</span>' +
        '<span class="hist-url" title="' + esc(rec.url) + '">' + esc(rec.url) + '</span>' +
        (rec.count > 1 ? '<span class="hist-count">×' + rec.count + '</span>' : '') +
        '<span class="hist-time">' + timeAgo(rec.ts) + '</span>' +
        '<button class="kv-del hist-del" title="Delete">×</button>';
      row.querySelector('.hist-del').addEventListener('click', function (e) {
        e.stopPropagation();
        deleteHistory(rec.id);
      });
      row.addEventListener('click', function () { loadHistory(rec.id); });
      box.appendChild(row);
    });
  }

  var historyModal = $('historyModal');
  $('btnHistory').addEventListener('click', function () {
    renderHistoryList();
    historyModal.classList.add('show');
  });
  $('historyClose').addEventListener('click', function () { historyModal.classList.remove('show'); });
  historyModal.addEventListener('click', function (e) { if (e.target === historyModal) historyModal.classList.remove('show'); });
  $('historyClear').addEventListener('click', function () {
    if (!confirm('Clear all request history?')) return;
    setHistory([]);
    renderHistoryList();
    renderHistoryBadge();
  });
  renderHistoryBadge();

  // ===== Sample request =====
  $('url').value = 'https://jsonplaceholder.typicode.com/posts/1';

  // Default to the most recent request if history exists
  loadMostRecent();
})();
</script>
</body>
</html>
